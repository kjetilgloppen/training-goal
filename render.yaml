# Render blueprint — https://render.com/docs/blueprint-spec
# Deploys the combined ASP.NET + Vue app as a single free Docker web service.
services:
  - type: web
    name: training-goal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Neon Postgres connection string — set in the Render dashboard (kept secret).
      - key: ConnectionStrings__Default
        sync: false
      # Google OAuth credentials (Google Cloud Console) — set in the Render dashboard.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Your Google email; claims the goals created before multi-user support.
      - key: OWNER_EMAIL
        sync: false
      # Comma-separated tester emails allowed to sign in (OWNER_EMAIL is always allowed).
      - key: ALLOWED_EMAILS
        sync: false
